apiVersion: apps/v1
kind: Deployment
metadata:
  name: arogyapos
  labels:
    app: arogyapos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arogyapos
  template:
    metadata:
      labels:
        app: arogyapos
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: arogyapos
          image: ghcr.io/your-username/arogyapos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: arogyapos-config
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: arogyapos-data-pvc
